{% extends "base.html" %}
{% block title %}PharmaFind — find it nearby{% endblock %}
{% block content %}

<section class="hero">
  <h1>Find who has it, and what it costs.</h1>
  <p class="hero-sub">Search once, see every participating pharmacy in town that carries it — ranked by price.</p>

  <form id="search-form" class="search-form" autocomplete="off">
    <input
      type="text"
      id="search-input"
      name="q"
      placeholder="Type a medication, a brand name, or what it's for — “something for allergies”"
      aria-label="Search for a medication"
    >
    <button type="submit">Search</button>
  </form>
</section>

<section class="results" id="results" aria-live="polite">
  <p class="results-hint">Results will appear here.</p>
</section>

<script src="{{ url_for('static', filename='js/search.js') }}"></script>
{% endblock %}
