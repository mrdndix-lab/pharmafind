<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .wordmark { font-family: Arial, Helvetica, sans-serif; font-weight: 800; }
      .tagline { font-family: Arial, Helvetica, sans-serif; font-weight: 400; }
      .row-text { font-family: Arial, Helvetica, sans-serif; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#16231F"/>

  <!-- pill/cross mark -->
  <g transform="translate(96,96)">
    <rect x="0" y="0" width="88" height="88" rx="20" fill="#C99A2E"/>
    <rect x="30" y="16" width="28" height="56" rx="8" fill="#16231F"/>
    <rect x="16" y="30" width="56" height="28" rx="8" fill="#16231F"/>
  </g>

  <text x="96" y="272" class="wordmark" font-size="86" fill="#F5F7F1">PharmaFind</text>
  <text x="98" y="322" class="tagline" font-size="30" fill="#B8C4BB">Compare medicine prices at pharmacies near you</text>

  <!-- ranked price ledger motif -->
  <g transform="translate(96,392)">
    <rect x="0" y="0" width="620" height="1" fill="#3A473F"/>
    <text x="0" y="46" class="row-text" font-size="26" fill="#F5F7F1">1</text>
    <text x="36" y="46" class="row-text" font-size="26" fill="#F5F7F1">CarePoint Chemist</text>
    <text x="620" y="46" class="row-text" font-size="26" fill="#C99A2E" text-anchor="end">$1.20</text>
    <rect x="0" y="62" width="620" height="1" fill="#3A473F"/>
    <text x="0" y="108" class="row-text" font-size="26" fill="#B8C4BB">2</text>
    <text x="36" y="108" class="row-text" font-size="26" fill="#B8C4BB">HealthPlus Pharmacy</text>
    <text x="620" y="108" class="row-text" font-size="26" fill="#B8C4BB" text-anchor="end">$1.50</text>
    <rect x="0" y="124" width="620" height="1" fill="#3A473F"/>
  </g>
</svg>
